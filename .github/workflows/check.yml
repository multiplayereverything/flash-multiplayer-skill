name: check
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -I tools/test_all.py
      - run: python tools/check_public.py
      - run: python tools/directory.py render
      - run: git diff --exit-code -- DIRECTORY.md
      - run: python tools/directory.py check
